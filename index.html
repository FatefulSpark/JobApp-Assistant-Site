<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careerfolio – Resumes, cover letters and skills</title>
<style>
:root{--ink:#10243f;--mut:#51657f;--blue:#2563eb;--deep:#1e40af;--sky:#dbeafe;--line:rgba(37,99,235,.28)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.5;min-height:100vh;
background:radial-gradient(circle at 12% 8%,#bfdbfe 0,transparent 38%),radial-gradient(circle at 90% 85%,#c7e0ff 0,transparent 40%),linear-gradient(135deg,#f5f9ff,#ffffff 55%,#e8f1ff);background-attachment:fixed;padding:20px}
.glass{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 32px rgba(30,64,175,.13);border-radius:18px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;margin-bottom:18px}
.brand{font-size:1.35rem;font-weight:800;color:var(--deep);letter-spacing:-.01em}
.who{display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--mut)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
nav.side{padding:14px;display:flex;flex-direction:column;gap:10px}
nav.side h2{font-size:.95rem;margin:4px 4px 0;color:var(--mut);font-weight:600}
main{padding:22px;min-width:0}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
h3{margin:0 0 6px;font-size:1.05rem}
p.sub{margin:0 0 18px;color:var(--mut);max-width:70ch}
button{font:inherit;font-weight:700;color:var(--deep);background:rgba(255,255,255,.75);border:2px solid var(--blue);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{background:var(--sky)}
button.pri{background:var(--blue);color:#fff}
button.pri:hover{background:var(--deep)}
button.danger{border-color:#b91c1c;color:#b91c1c}
button.danger:hover{background:#fee2e2}
button.nav{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px}
button.nav.on{background:var(--blue);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.count{font-weight:600;opacity:.85}
label{display:block;font-weight:700;font-size:.9rem;margin:0 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.85);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:110px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.box{background:rgba(255,255,255,.7);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.item>div{min-width:0;flex:1 1 220px;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--blue);background:var(--sky);color:var(--deep);border-radius:999px;padding:3px 6px 3px 12px;font-weight:700}
.chip button{border:0;background:transparent;padding:0 6px;color:var(--deep);line-height:1.2}
.muted{color:var(--mut);font-size:.92rem}
.msg{min-height:1.4em;margin:0 0 10px;font-weight:700}
.msg.ok{color:#047857}.msg.err{color:#b91c1c}
.bar{height:8px;border-radius:99px;background:#dbeafe;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.auth{max-width:440px;margin:6vh auto;padding:26px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:16px;color:var(--mut);margin-bottom:12px}
@media(max-width:780px){.layout{grid-template-columns:1fr}nav.side{flex-direction:row;flex-wrap:wrap}nav.side h2{width:100%}button.nav{width:auto;flex:1 1 140px}body{padding:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const J=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){note("Could not save: browser storage is full or blocked.","err");return false}};
let uid=J("cf:session",null),view="skills",ed=null,mode="in",found=null,msg=null;
const uniq=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
/* Every read/write of personal data goes through key(), which is always scoped to the signed-in user's id. */
const key=k=>{if(!uid)throw new Error("Not signed in");return"cf:u:"+uid+":"+k};
const get=k=>J(key(k),[]);
const put=(k,v)=>W(key(k),v);
function note(t,c){msg={t,c}}
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const ch of s)h=(h*33^ch.charCodeAt(0))>>>0;return"w"+h}}
const FOLDERS=[["skills","Skills"],["experiences","Experiences"],["resumes","Resumes"],["letters","Cover Letters"]];
const STOP=new Set("the and for with that this you your our are will from have has not but all can who their they about into more work able such also been out use using per etc job role team".split(" "));
const toks=t=>(String(t).toLowerCase().match(/[a-z0-9+#.]{3,}/g)||[]).map(w=>w.replace(/\.+$/,"")).filter(w=>w&&!STOP.has(w));

function render(){
  const a=$("#app");
  if(!uid){a.innerHTML=authView();return}
  const me=Object.values(J("cf:users",{})).find(u=>u.id===uid);
  if(!me){uid=null;W("cf:session",null);return render()}
  const nav=FOLDERS.map(([k,n])=>`<button class="nav ${view===k?"on":""}" data-act="go" data-v="${k}"><span>${n}</span><span class="count">${get(k).length}</span></button>`).join("")+
    `<button class="nav ${view==="match"?"on":""}" data-act="go" data-v="match"><span>Job Match</span></button>`;
  const m=msg?`<p class="msg ${msg.c}" role="status">${esc(msg.t)}</p>`:`<p class="msg" role="status"></p>`;
  msg=null;
  a.innerHTML=`<header class="top glass"><div class="brand">Careerfolio</div><div class="who"><span>Signed in as ${esc(me.name)}</span><button data-act="out">Sign out</button></div></header>
  <div class="layout"><nav class="side glass" aria-label="Your folders"><h2>Your folders</h2>${nav}</nav><main class="glass">${m}${body()}</main></div>`;
}
function authView(){
  const up=mode==="up";
  const m=msg?`<p class="msg ${msg.c}" role="status">${esc(msg.t)}</p>`:`<p class="msg" role="status"></p>`;msg=null;
  return`<div class="auth glass"><div class="brand">Careerfolio</div><p class="sub">Write resumes and cover letters that stand out. Your skills, experiences and documents stay private to your account.</p>
  <div class="tabs"><button class="${up?"":"pri"}" data-act="mode" data-v="in">Sign in</button><button class="${up?"pri":""}" data-act="mode" data-v="up">Create account</button></div>${m}
  <form data-form="auth">${up?`<div class="box"><label for="n">Your name</label><input id="n" name="name" required maxlength="60" autocomplete="name"></div>`:""}
  <div class="box"><label for="e">Email</label><input id="e" name="email" type="email" required autocomplete="email"></div>
  <div class="box"><label for="p">Password (6+ characters)</label><input id="p" name="pw" type="password" required minlength="6" autocomplete="${up?"new-password":"current-password"}"></div>
  <button class="pri" type="submit">${up?"Create account":"Sign in"}</button></form>
  <p class="muted">Data is saved in this browser only. Accounts on one device cannot see each other's data.</p></div>`;
}
function body(){
  if(ed)return editorView();
  if(view==="skills")return skillsView();
  if(view==="experiences")return expView();
  if(view==="match")return matchView();
  return docsView(view);
}
function skillsView(){
  const s=get("skills");
  return`<h1>Skills</h1><p class="sub">Keep every skill you have. Job Match picks the best ones for each application.</p>
  <form data-form="skill" class="box"><label for="sk">Add skills (separate with commas)</label><div class="row"><input id="sk" name="skills" required placeholder="Excel, Public speaking, Customer service"></div><button class="pri" type="submit">Add skills</button></form>
  ${s.length?`<div class="chips">${s.map(x=>`<span class="chip">${esc(x.name)}<button data-act="delskill" data-id="${x.id}" aria-label="Remove ${esc(x.name)}">&times;</button></span>`).join("")}</div>`:`<div class="empty">No skills yet. Add your first one above.</div>`}`;
}
function expView(){
  const e=get("experiences");
  return`<h1>Experiences</h1><p class="sub">Jobs, volunteering, projects and clubs. Describe what you did and the result, one point per line.</p>
  <form data-form="exp" class="box"><div class="row"><div><label for="t">Role</label><input id="t" name="title" required maxlength="80"></div><div><label for="o">Organization</label><input id="o" name="org" required maxlength="80"></div><div><label for="d">Dates</label><input id="d" name="dates" maxlength="40" placeholder="Nov 2025 – Jan 2026"></div></div>
  <label for="ds">What you did</label><textarea id="ds" name="desc" required placeholder="Served up to 600 guests a day&#10;Trained on specialized equipment"></textarea><div style="height:12px"></div><button class="pri" type="submit">Save experience</button></form>
  ${e.length?e.map(x=>`<div class="box item"><div><h3>${esc(x.title)} – ${esc(x.org)}</h3><div class="muted">${esc(x.dates)}</div><div>${esc(x.desc).replace(/\n/g,"<br>")}</div></div><div class="acts"><button class="danger" data-act="delexp" data-id="${x.id}">Delete</button></div></div>`).join(""):`<div class="empty">No experiences yet. Add one above.</div>`}`;
}
function docsView(k){
  const label=k==="resumes"?"Resume":"Cover letter",d=get(k);
  return`<h1>${label}s</h1><p class="sub">Every save is kept as a new version, so you can always go back.</p>
  <form data-form="newdoc" class="box"><label for="dt">New ${label.toLowerCase()} title</label><div class="row"><input id="dt" name="title" required maxlength="80" placeholder="${k==="resumes"?"Resume – Marketing intern":"Cover letter – Acme Corp"}"></div><button class="pri" type="submit">Create ${label.toLowerCase()}</button></form>
  ${d.length?d.map(x=>`<div class="box item"><div><h3>${esc(x.title)}</h3><div class="muted">${x.versions.length} version${x.versions.length===1?"":"s"} · updated ${new Date(x.versions[x.versions.length-1].ts).toLocaleString()}</div></div><div class="acts"><button class="pri" data-act="open" data-id="${x.id}">Open</button><button class="danger" data-act="deldoc" data-id="${x.id}">Delete</button></div></div>`).join(""):`<div class="empty">No ${label.toLowerCase()}s yet. Create one above, or build a draft in Job Match.</div>`}`;
}
function editorView(){
  const d=get(ed.kind).find(x=>x.id===ed.id);
  if(!d){ed=null;return docsView(view)}
  const last=d.versions[d.versions.length-1];
  return`<h1>${esc(d.title)}</h1><p class="sub">Edit the text, then save it as a new version.</p>
  <div class="box"><label for="tt">Title</label><input id="tt" value="${esc(d.title)}" maxlength="80"><div style="height:12px"></div><label for="tx">Document text</label><textarea id="tx" style="min-height:340px">${esc(last?last.text:"")}</textarea></div>
  <div class="acts" style="margin-bottom:18px"><button class="pri" data-act="save">Save new version</button><button data-act="back">Back to list</button></div>
  <h3>Version history</h3>${d.versions.slice().reverse().map((v,i)=>{const n=d.versions.length-i;return`<div class="box item"><div><strong>Version ${n}</strong><div class="muted">${new Date(v.ts).toLocaleString()} · ${v.text.length} characters</div></div><div class="acts"><button data-act="load" data-n="${n-1}">Load into editor</button></div></div>`}).join("")}`;
}
function matchView(){
  return`<h1>Job Match</h1><p class="sub">Paste a job posting. We compare it only with your own saved skills and experiences, then draft documents from the best matches.</p>
  <form data-form="match" class="box"><div class="row"><div><label for="jt">Job title</label><input id="jt" name="jt" required maxlength="80"></div><div><label for="jc">Company</label><input id="jc" name="jc" required maxlength="80"></div></div>
  <label for="jd">Job description</label><textarea id="jd" name="jd" required style="min-height:180px"></textarea><div style="height:12px"></div><button class="pri" type="submit">Find my best matches</button></form>
  ${found?resultView():""}`;
}
function resultView(){
  const f=found,sk=f.skills.length?f.skills.map(s=>`<div class="box"><strong>${esc(s.name)}</strong><div class="bar"><i style="width:${s.pct}%"></i></div></div>`).join(""):`<div class="empty">None of your saved skills match this posting yet. Add related skills in the Skills folder.</div>`;
  const ex=f.exps.length?f.exps.map(s=>`<div class="box"><strong>${esc(s.title)} – ${esc(s.org)}</strong><div class="bar"><i style="width:${s.pct}%"></i></div></div>`).join(""):`<div class="empty">None of your saved experiences match this posting yet.</div>`;
  return`<h3>Best skills to mention for ${esc(f.jt)} at ${esc(f.jc)}</h3>${sk}<h3>Best experiences to feature</h3>${ex}
  <div class="acts"><button class="pri" data-act="draft" data-k="resumes">Create resume draft</button><button class="pri" data-act="draft" data-k="letters">Create cover letter draft</button></div>`;
}
function analyze(jt,jc,jd){
  const text=(jt+" "+jd).toLowerCase(),jt_=new Set(toks(text));
  const sk=get("skills").map(s=>{const n=s.name.toLowerCase();let sc=text.includes(n)?10:0;toks(n).forEach(w=>{if(jt_.has(w))sc+=3});return{...s,sc}}).filter(s=>s.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,8);
  const mine=get("skills").map(s=>s.name.toLowerCase());
  const ex=get("experiences").map(e=>{const body=(e.title+" "+e.org+" "+e.desc).toLowerCase();let sc=0;new Set(toks(body)).forEach(w=>{if(jt_.has(w))sc+=1});mine.forEach(n=>{if(text.includes(n)&&body.includes(n))sc+=4});return{...e,sc}}).filter(e=>e.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,4);
  const pct=l=>{const m=l.length?l[0].sc:1;l.forEach(x=>x.pct=Math.max(12,Math.round(x.sc/m*100)))};pct(sk);pct(ex);
  return{jt,jc,skills:sk,exps:ex};
}
function draft(k){
  const me=Object.values(J("cf:users",{})).find(u=>u.id===uid),f=found;
  const sk=f.skills.map(s=>s.name),bul=e=>e.desc.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>"• "+l).join("\n");
  if(k==="resumes")return`${me.name}\n\nSUMMARY\nMotivated candidate applying for ${f.jt} at ${f.jc}, with strengths in ${sk.slice(0,3).join(", ")||"[add your top skills]"}.\n\nKEY SKILLS\n${sk.join(" · ")||"[add skills in the Skills folder]"}\n\nEXPERIENCE\n${f.exps.map(e=>`${e.title} – ${e.org}${e.dates?" ("+e.dates+")":""}\n${bul(e)}`).join("\n\n")||"[add experiences in the Experiences folder]"}\n`;
  const e=f.exps[0];
  return`Dear ${f.jc} Hiring Team,\n\nI am excited to apply for the ${f.jt} position at ${f.jc}. My strengths in ${sk.slice(0,3).join(", ")||"[your top skills]"} match what this role asks for.\n\n${e?`As ${e.title} at ${e.org}, I put these skills into practice:\n${bul(e)}\n\n`:""}I would welcome the chance to bring this experience to ${f.jc}. Thank you for your time and consideration.\n\nSincerely,\n${me.name}\n`;
}
function makeDoc(k,title,text){
  const d=get(k),doc={id:uniq(),title,versions:[{ts:Date.now(),text}]};
  d.push(doc);if(put(k,d))return doc;return null;
}
document.addEventListener("submit",async ev=>{
  const f=ev.target.dataset.form;if(!f)return;ev.preventDefault();
  const v=Object.fromEntries(new FormData(ev.target).entries());
  if(f==="auth"){
    const email=v.email.trim().toLowerCase(),users=J("cf:users",{});
    if(mode==="up"){
      if(users[email]){note("An account with that email already exists. Sign in instead.","err");return render()}
      const salt=uniq()+uniq();users[email]={id:uniq()+uniq(),name:v.name.trim(),salt,hash:await hash(salt+v.pw)};
      if(!W("cf:users",users))return render();uid=users[email].id;
    }else{
      const u=users[email];
      if(!u||u.hash!==await hash(u.salt+v.pw)){note("Email or password is incorrect.","err");return render()}
      uid=u.id;
    }
    W("cf:session",uid);view="skills";ed=null;found=null;return render();
  }
  if(f==="skill"){
    const s=get("skills"),have=new Set(s.map(x=>x.name.toLowerCase()));let n=0;
    v.skills.split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!have.has(x.toLowerCase())){have.add(x.toLowerCase());s.push({id:uniq(),name:x.slice(0,60)});n++}});
    if(put("skills",s))note(n?`Added ${n} skill${n>1?"s":""}.`:"Those skills are already saved.",n?"ok":"err");
  }
  if(f==="exp"){const e=get("experiences");e.push({id:uniq(),title:v.title.trim(),org:v.org.trim(),dates:(v.dates||"").trim(),desc:v.desc.trim()});if(put("experiences",e))note("Experience saved.","ok")}
  if(f==="newdoc"){const d=makeDoc(view,v.title.trim(),"");if(d){ed={kind:view,id:d.id}}}
  if(f==="match"){found=analyze(v.jt.trim(),v.jc.trim(),v.jd)}
  render();
});
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==="mode"){mode=b.dataset.v;msg=null}
  else if(a==="out"){uid=null;ed=null;found=null;W("cf:session",null)}
  else if(a==="go"){view=b.dataset.v;ed=null}
  else if(a==="delskill"){put("skills",get("skills").filter(x=>x.id!==id))}
  else if(a==="delexp"){if(confirm("Delete this experience?"))put("experiences",get("experiences").filter(x=>x.id!==id))}
  else if(a==="deldoc"){if(confirm("Delete this document and all its versions?"))put(view,get(view).filter(x=>x.id!==id))}
  else if(a==="open"){ed={kind:view,id}}
  else if(a==="back"){ed=null}
  else if(a==="load"){const d=get(ed.kind).find(x=>x.id===ed.id);note("Version loaded. Save to keep it as a new version.","ok");render();$("#tx").value=d.versions[+b.dataset.n].text;return}
  else if(a==="save"){
    const all=get(ed.kind),d=all.find(x=>x.id===ed.id);d.title=($("#tt").value.trim()||d.title).slice(0,80);d.versions.push({ts:Date.now(),text:$("#tx").value});
    if(put(ed.kind,all))note(`Saved as version ${d.versions.length}.`,"ok");
  }
  else if(a==="draft"){const k=b.dataset.k,d=makeDoc(k,(k==="resumes"?"Resume – ":"Cover letter – ")+found.jt+" at "+found.jc,draft(k));if(d){view=k;ed={kind:k,id:d.id};note("Draft created. Edit it and save a new version.","ok")}}
  render();
});
render();
</script>
</body>
</html>
