<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careerfolio</title>
<style>
:root{--ink:#10243f;--mut:#51657f;--blue:#2563eb;--deep:#1e40af;--sky:#dbeafe;--line:rgba(37,99,235,.28)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.5;min-height:100vh;
background:radial-gradient(circle at 12% 8%,#bfdbfe 0,transparent 38%),radial-gradient(circle at 90% 85%,#c7e0ff 0,transparent 40%),linear-gradient(135deg,#f5f9ff,#ffffff 55%,#e8f1ff);background-attachment:fixed;padding:20px}
.glass{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);box-shadow:0 10px 32px rgba(30,64,175,.13);border-radius:18px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px 20px;margin-bottom:18px}
.brand{font-size:1.35rem;font-weight:800;color:var(--deep);letter-spacing:-.01em}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
header .tabs{margin:0}
.right{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--mut)}
main{padding:22px;min-width:0}
h1{font-size:1.65rem;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0 0 10px}
h3{margin:0 0 6px;font-size:1.05rem}
p.sub{margin:0 0 18px;color:var(--mut)}
p.tag{margin:0 0 18px;color:var(--ink);font-size:1rem}
button{font:inherit;font-weight:700;color:var(--deep);background:rgba(255,255,255,.75);border:2px solid var(--blue);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{background:var(--sky)}
button.pri{background:var(--blue);color:#fff}
button.pri:hover{background:var(--deep)}
button.danger{border-color:#b91c1c;color:#b91c1c}
button.danger:hover{background:#fee2e2}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.drop:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
label{display:block;font-weight:700;font-size:.9rem;margin:0 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.85);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:110px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.box{background:rgba(255,255,255,.7);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.item>div:first-child{min-width:0;flex:1 1 220px;overflow-wrap:anywhere}
.item ul{margin:6px 0 0;padding-left:20px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--blue);background:var(--sky);color:var(--deep);border-radius:999px;padding:3px 6px 3px 12px;font-weight:700}
.chip button{border:0;background:transparent;padding:0 6px;color:var(--deep);line-height:1.2}
.muted{color:var(--mut);font-size:.92rem}
.msg{min-height:1.4em;margin:0 0 10px;font-weight:700;overflow-wrap:anywhere}
.msg.ok{color:#047857}.msg.err{color:#b91c1c}
.bar{height:8px;border-radius:99px;background:#dbeafe;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.auth{max-width:440px;margin:6vh auto;padding:26px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:14px;color:var(--mut);margin-bottom:12px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:150px;padding:22px;margin-bottom:10px;border:2.5px dashed var(--blue);border-radius:16px;background:rgba(219,234,254,.45);color:var(--deep);cursor:pointer}
.drop:hover,.drop.over{background:var(--sky);border-style:solid}
.drop strong{font-size:1.1rem}
.gap{height:12px}
@media(max-width:780px){body{padding:12px}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const J=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let uid=J("cf:session",null),view="resume",sview="skills",ed=null,mode="in",found=null,msg=null,cur=null,upKind="auto";
const uniq=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
/* All personal data goes through key(), which is always scoped to the signed-in user's id. */
const key=k=>{if(!uid)throw new Error("Not signed in");return"cf:u:"+uid+":"+k};
const get=k=>J(key(k),[]);
const putData=(k,v)=>{if(W(key(k),v))return true;note("Could not save: browser storage is full or blocked.","err");return false};
function note(t,c){msg={t,c}}
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const ch of s)h=(h*33^ch.charCodeAt(0))>>>0;return"w"+h}}
const FOLDERS=[["skills","Skills"],["experiences","Experiences"],["resumes","Resumes"],["letters","Cover Letters"]];
const STOP=new Set("the and for with that this you your our are will from have has not but all can who their they about into more work able such also been out use using per etc job role team".split(" "));
const toks=t=>(String(t).toLowerCase().match(/[a-z0-9+#.]{3,}/g)||[]).map(w=>w.replace(/\.+$/,"")).filter(w=>w&&!STOP.has(w));
const me=()=>Object.values(J("cf:users",{})).find(u=>u.id===uid);

/* ---------- file reading ---------- */
const PDF="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",PDFW="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",MAM="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
const loadJS=u=>new Promise((ok,no)=>{if(document.querySelector('script[src="'+u+'"]'))return ok();const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>no(new Error("Could not load the file reader. Check your internet connection."));document.head.appendChild(s)});
async function readFile(f){
  const n=f.name.toLowerCase();
  if(!/\.(pdf|txt|doc|docx)$/.test(n))throw new Error("Only PDF, TXT, DOC and DOCX files are supported.");
  if(f.size>8*1024*1024)throw new Error("That file is over 8 MB.");
  const buf=await f.arrayBuffer();
  if(n.endsWith(".txt"))return new TextDecoder().decode(buf);
  if(n.endsWith(".pdf")){
    await loadJS(PDF);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
    const p=await pdfjsLib.getDocument({data:buf}).promise;let out="";
    for(let i=1;i<=p.numPages;i++){const c=await(await p.getPage(i)).getTextContent();let y=null;
      for(const it of c.items){const yy=it.transform[5];if(y!==null)out+=Math.abs(yy-y)>3?"\n":" ";out+=it.str;y=yy}out+="\n"}
    return out;
  }
  if(n.endsWith(".docx")){await loadJS(MAM);return(await mammoth.extractRawText({arrayBuffer:buf})).value}
  const s=new TextDecoder("latin1").decode(buf);return(s.match(/[\x20-\x7E]{25,}/g)||[]).join("\n");
}
/* ---------- reading experiences and skills from text ---------- */
const HEAD=/^(?:(?:professional|work|relevant|related|technical|key|core|additional|selected|leadership|volunteer)\s+)?(experience|employment|volunteer|volunteering|projects?|activities|leadership|skills?|education|certifications?|summary|objective|languages|awards|interests|references)\s*:?$/i;
const EXP=/^(experience|employment|volunteer|volunteering|project|projects|activities|leadership)$/;
const MO=String.raw`(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+`;
const DT=new RegExp(String.raw`(?:${MO})?(?:\d{1,2}\/)?\d{4}\s*[–—-]\s*(?:present|current|now|(?:${MO})?(?:\d{1,2}\/)?\d{4})`,"i");
const BUL=/^[•●▪*·\-–]\s*/;
const VERB=/^(?:led|built|created|developed|managed|organi[sz]ed|assisted|volunteered|provided|adapted|operated|coordinated|served|trained|designed|implemented|supported|planned|ran|handled|helped|maintained|collaborated|performed|prepared|presented|completed|achieved|increased|reduced|improved|analy[sz]ed|wrote|taught|tutored|mentored|shadowed|observed|delivered|oversaw|worked|participated|contributed|launched|produced|processed|resolved|communicated|conducted|demonstrated|executed|facilitated|generated|researched|sold|streamlined|utilized|used|earned|received|cleaned|stocked|greeted|answered|scheduled|recorded|tracked|monitored|supervised|directed|spearheaded|established|drove|grew|raised|coached|welcomed|managed|responsible|selected|learned|gained|applied|attended|joined|performed|ensured|balanced|booked|checked|set|made|took|gave)\b/i;
const descLike=l=>BUL.test(l)||/^[a-z]/.test(l)||(/[.;:]$/.test(l)&&!/\b(?:inc|llc|ltd|co|corp)\.$/i.test(l))||l.length>75||(VERB.test(l)&&l.split(" ").length>1)||(/^[A-Z][a-z]+ed\b/.test(l)&&l.split(" ").length>2);
const isHead=l=>!BUL.test(l)&&l.length<=110&&!/[.;]$/.test(l.replace(/\b(?:inc|llc|ltd|co|corp)\.$/i,""))&&(DT.test(l)||!descLike(l));
const cleanH=x=>x.replace(DT,"").replace(/[()]/g,"").replace(/^[\s,|–—-]+|[\s,|–—-]+$/g,"").trim();
function finish(c){
  const dates=c.h.map(x=>(x.match(DT)||[""])[0]).find(Boolean)||"",p=c.h.map(cleanH).filter(Boolean);
  let title=p[0]||"",org=p.slice(1).join(", ");
  if(p.length===1){const m=p[0].split(/\s[–—-]\s|\s\|\s|\s+at\s+/);title=m[0].trim();org=m.slice(1).join(" – ").trim()}
  return{title,org,dates,desc:c.d.join("\n")};
}
function parseDoc(text){
  const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  let sec="";const S={};
  for(const l of lines){const m=l.length<=40&&l.match(HEAD);if(m){sec=m[1].toLowerCase();S[sec]=S[sec]||[];continue}if(sec)S[sec].push(l)}
  const skills=[];
  for(const k in S)if(/^skill/.test(k))S[k].forEach(l=>l.replace(BUL,"").replace(/^[^:,]{0,30}:\s*/,"").split(/[,;|•·●▪]/).map(x=>x.trim()).forEach(x=>{if(x.length>1&&x.length<=40)skills.push(x)}));
  const exps=[];let c=null;
  const done=()=>{if(c){const e=finish(c);if(e.title)exps.push(e)}c=null};
  for(const k in S){
    if(!EXP.test(k))continue;done();
    const L=S[k],marked=L.filter(x=>BUL.test(x)).length>=2;
    for(let i=0;i<L.length;i++){
      const l=L[i],nx=L[i+1]||"",hasDt=DT.test(l);
      let head=isHead(l);
      /* A header-looking line in the middle of a description only starts a new experience if a date or an organization line follows. */
      if(head&&c&&c.d.length&&!hasDt)head=DT.test(nx)||(marked&&nx&&!BUL.test(nx)&&isHead(nx));
      if(!head){
        if(!c)continue;
        if(!BUL.test(l)&&c.d.length&&(marked||/^[a-z]/.test(l)))c.d[c.d.length-1]+=" "+l;else c.d.push(l.replace(BUL,""));
        continue;
      }
      if(c&&!c.d.length&&!(hasDt&&c.dt)&&c.h.length<(c.dt?2:3)){c.h.push(l);if(hasDt)c.dt=true;continue}
      done();c={h:[l],d:[],dt:hasDt};
    }
    done();
  }
  return{skills,exps};
}
async function handleUpload(file,kind){
  const u0=uid,text=(await readFile(file)).trim();
  if(uid!==u0)throw new Error("You signed out before the file finished reading.");
  if(text.length<30)throw new Error("No readable text found. Scanned pages and images can't be read, so try a text-based PDF, DOCX or TXT.");
  if(kind==="auto")kind=/^\s*dear\b/i.test(text)||/\b(sincerely|yours truly|best regards|kind regards)\b/i.test(text.slice(-300))?"letters":"resumes";
  const doc=makeDoc(kind,file.name.replace(/\.[^.]+$/,"").slice(0,80),text);
  if(!doc)throw new Error("Not enough browser storage left for this file.");
  const r=parseDoc(text);
  const sk=get("skills"),have=new Set(sk.map(x=>x.name.toLowerCase()));let ns=0;
  r.skills.forEach(x=>{if(!have.has(x.toLowerCase())){have.add(x.toLowerCase());sk.push({id:uniq(),name:x});ns++}});
  const ex=get("experiences"),seen=new Set(ex.map(x=>(x.title+"|"+x.org).toLowerCase()));let ne=0;
  r.exps.forEach(x=>{const id=(x.title+"|"+x.org).toLowerCase();if(!seen.has(id)){seen.add(id);ex.push({id:uniq(),...x});ne++}});
  if(ns)putData("skills",sk);if(ne)putData("experiences",ex);
  return`Saved "${file.name}" as an editable ${kind==="resumes"?"resume":"cover letter"}. Added ${ns} skill${ns===1?"":"s"} and ${ne} experience${ne===1?"":"s"}.`;
}
async function ingest(list){
  if(!list.length||!uid)return;
  const ok=[],bad=[],st=()=>$("#upstat");
  for(const f of list){
    if(st()){st().className="msg ok";st().textContent="Reading "+f.name+"…"}
    try{ok.push(await handleUpload(f,upKind))}catch(e){bad.push(`"${f.name}": ${e.message||"couldn't be read."}`)}
  }
  note(ok.concat(bad).join(" "),bad.length?"err":"ok");render();
}

/* ---------- views ---------- */
function render(){
  const a=$("#app");
  if(!uid){a.innerHTML=authView();return}
  const m=me();if(!m){uid=null;W("cf:session",null);return render()}
  const t=(v,n)=>`<button class="${view===v?"pri":""}" data-act="go" data-v="${v}">${n}</button>`;
  cur=msg;msg=null;const st=view==="storage"&&!ed;
  const ms=cur&&!st?`<p class="msg ${cur.c}" role="status">${esc(cur.t)}</p>`:`<p class="msg" role="status"></p>`;
  a.innerHTML=`<header class="top glass"><div class="brand">Careerfolio</div><div class="tabs">${t("resume","Resume Builder")}${t("letter","Cover Letter Builder")}</div>
  <div class="right">${t("storage","Storage")}<span>${esc(m.name)}</span><button data-act="out">Sign out</button></div></header><main class="glass">${ms}${body()}</main>`;
}
function authView(){
  const up=mode==="up";
  const m=msg?`<p class="msg ${msg.c}" role="status">${esc(msg.t)}</p>`:`<p class="msg" role="status"></p>`;msg=null;
  return`<div class="auth glass"><h1>Welcome to Careerfolio.</h1><p class="tag">A storage place for all of your job application files</p>
  <div class="tabs"><button class="${up?"":"pri"}" data-act="mode" data-v="in">Sign in</button><button class="${up?"pri":""}" data-act="mode" data-v="up">Create account</button></div>${m}
  <form data-form="auth">${up?`<div class="box"><label for="n">Your name</label><input id="n" name="name" required maxlength="60" autocomplete="name"></div>`:""}
  <div class="box"><label for="e">Email</label><input id="e" name="email" type="email" required autocomplete="email"></div>
  <div class="box"><label for="p">Password (6+ characters)</label><input id="p" name="pw" type="password" required minlength="6" autocomplete="${up?"new-password":"current-password"}"></div>
  <button class="pri" type="submit">${up?"Create account":"Sign in"}</button></form>
  <p class="muted">Your data stays in this browser.</p></div>`;
}
function body(){
  if(ed)return editorView();
  if(view==="storage")return storageView();
  return builderView(view==="letter"?"letters":"resumes");
}
function builderView(k){
  const first=esc(me().name.split(" ")[0]);
  return`<h1>Welcome back, ${first}.</h1><p class="sub">Ready when you are.</p>
  <form data-form="match" class="box"><h2>Target job</h2><div class="row"><div><label for="jt">Job title</label><input id="jt" name="jt" required maxlength="80"></div><div><label for="jc">Company</label><input id="jc" name="jc" required maxlength="80"></div></div>
  <label for="jd">Job description</label><textarea id="jd" name="jd" required style="min-height:160px"></textarea><div class="gap"></div><button class="pri" type="submit">Find my best matches</button></form>
  ${found?resultView(k):""}${docsView(k)}`;
}
function resultView(k){
  const f=found,lab=k==="resumes"?"resume":"cover letter";
  const sk=f.skills.length?f.skills.map(s=>`<div class="box"><strong>${esc(s.name)}</strong><div class="bar"><i style="width:${s.pct}%"></i></div></div>`).join(""):`<div class="empty">No saved skills match this job yet.</div>`;
  const ex=f.exps.length?f.exps.map(s=>`<div class="box"><strong>${esc(s.title)}${s.org?" – "+esc(s.org):""}</strong><div class="bar"><i style="width:${s.pct}%"></i></div></div>`).join(""):`<div class="empty">No saved experiences match this job yet.</div>`;
  return`<h2>Best skills for ${esc(f.jt)} at ${esc(f.jc)}</h2>${sk}<h2>Best experiences to feature</h2>${ex}
  <div class="acts" style="margin-bottom:22px"><button class="pri" data-act="draft" data-k="${k}">Create ${lab} draft</button></div>`;
}
function storageView(){
  const tabs=FOLDERS.map(([k,n])=>`<button class="${sview===k?"pri":""}" data-act="sgo" data-v="${k}">${n} (${get(k).length})</button>`).join("");
  const sel=(v,n)=>`<option value="${v}"${upKind===v?" selected":""}>${n}</option>`;
  return`<h1>Storage</h1><p class="sub">Everything you've saved, in one place.</p>
  <div class="box"><h2>Add files</h2><div class="row"><div><label for="kd">Save as</label><select id="kd">${sel("auto","Detect automatically")}${sel("resumes","Resume")}${sel("letters","Cover letter")}</select></div></div>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Drop files here, or click to choose files from your computer"><strong>Drag and drop files here</strong><span>or click to choose from your computer</span><span class="muted">PDF, TXT, DOC or DOCX</span></div>
  <input id="fi" type="file" accept=".pdf,.txt,.doc,.docx" multiple hidden>
  <p class="msg ${cur?cur.c:""}" id="upstat" role="status">${cur?esc(cur.t):""}</p></div>
  <div class="tabs">${tabs}</div>${sview==="skills"?skillsView():sview==="experiences"?expView():docsView(sview)}`;
}
function skillsView(){
  const s=get("skills");
  return`<form data-form="skill" class="box"><label for="sk">Add skills (separate with commas)</label><div class="row"><input id="sk" name="skills" required placeholder="Excel, Public speaking, Customer service"></div><button class="pri" type="submit">Add skills</button></form>
  ${s.length?`<div class="chips">${s.map(x=>`<span class="chip">${esc(x.name)}<button data-act="delskill" data-id="${x.id}" aria-label="Remove ${esc(x.name)}">&times;</button></span>`).join("")}</div>`:`<div class="empty">No skills saved yet.</div>`}`;
}
function expView(){
  const e=get("experiences");
  return`<form data-form="exp" class="box"><div class="row"><div><label for="t">Role</label><input id="t" name="title" required maxlength="80"></div><div><label for="o">Organization</label><input id="o" name="org" maxlength="80"></div><div><label for="d">Dates</label><input id="d" name="dates" maxlength="40" placeholder="Nov 2025 – Jan 2026"></div></div>
  <label for="ds">What you did (one point per line)</label><textarea id="ds" name="desc" required></textarea><div class="gap"></div><button class="pri" type="submit">Save experience</button></form>
  ${e.length?e.map(x=>`<div class="box item"><div><h3>${esc(x.title)}${x.org?" – "+esc(x.org):""}</h3><div class="muted">${esc(x.dates)}</div>${x.desc?`<ul>${x.desc.split("\n").filter(Boolean).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}</div><div class="acts"><button class="danger" data-act="delexp" data-id="${x.id}">Delete</button></div></div>`).join(""):`<div class="empty">No experiences saved yet.</div>`}`;
}
function docsView(k){
  const label=k==="resumes"?"resume":"cover letter",d=get(k);
  return`<h2>${k==="resumes"?"Your resumes":"Your cover letters"}</h2>
  <form data-form="newdoc" class="box"><input type="hidden" name="k" value="${k}"><label for="dt${k}">New ${label}</label><div class="row"><input id="dt${k}" name="title" required maxlength="80" placeholder="${k==="resumes"?"Resume – Marketing intern":"Cover letter – Acme Corp"}"></div><button class="pri" type="submit">Create ${label}</button></form>
  ${d.length?d.map(x=>`<div class="box item"><div><h3>${esc(x.title)}</h3><div class="muted">${x.versions.length} version${x.versions.length===1?"":"s"} · updated ${new Date(x.versions[x.versions.length-1].ts).toLocaleString()}</div></div><div class="acts"><button class="pri" data-act="open" data-k="${k}" data-id="${x.id}">Open</button><button data-act="dup" data-k="${k}" data-id="${x.id}">Duplicate</button><button class="danger" data-act="deldoc" data-k="${k}" data-id="${x.id}">Delete</button></div></div>`).join(""):`<div class="empty">No ${label}s yet.</div>`}`;
}
function editorView(){
  const d=get(ed.kind).find(x=>x.id===ed.id);
  if(!d){ed=null;return body()}
  const last=d.versions[d.versions.length-1];
  return`<h1>${esc(d.title)}</h1>
  <div class="box"><label for="tt">Title</label><input id="tt" value="${esc(d.title)}" maxlength="80"><div class="gap"></div><label for="tx">Document</label><textarea id="tx" style="min-height:340px">${esc(last?last.text:"")}</textarea></div>
  <div class="acts" style="margin-bottom:18px"><button class="pri" data-act="save">Save new version</button><button data-act="back">Back</button></div>
